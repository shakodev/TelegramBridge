[package]
name = "telegram-codex-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
default-run = "telegram-codex-bridge"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

[features]
test-support = []

[[bin]]
name = "mock-codex"
path = "tests/support/mock_codex.rs"
required-features = ["test-support"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
